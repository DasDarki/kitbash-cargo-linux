[package]
name = "kitbash-cargo-linux"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
crc32fast = "1.5.6"
flate2 = "1.1.11"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sevenz-rust2 = { version = "0.27.0", default-features = false }
sha2 = "0.11.2"
tar = "0.4.46"
ureq = "2"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
